version: "2"

linters:
  default: standard

  enable:
    - bodyclose
    - contextcheck
    - gocritic
    - gosec
    - nilerr
    - revive

  settings:
    staticcheck:
      # Disables ST1005 while keeping all other staticcheck rules active
      checks: ["all", "-ST1005"]
    revive:
      rules:
        # Disables error-strings check in revive
        - name: error-strings
          disabled: true

formatters:
  enable:
    - gofmt

run:
  modules-download-mode: readonly
